          - code [ref=f7e58]: CREATE TABLE customers ( id UUID PRIMARY KEY, email VARCHAR(255) UNIQUE, full_name VARCHAR(100), country VARCHAR(2), created_at TIMESTAMP ); CREATE TABLE products ( id UUID PRIMARY KEY, sku VARCHAR(40) UNIQUE, name VARCHAR(120), price DECIMAL(10,2), stock INT ); CREATE TABLE orders ( id UUID PRIMARY KEY, customer_id UUID REFERENCES customers(id), product_id UUID REFERENCES products(id), quantity INT, total DECIMAL(10,2), created_at TIMESTAMP );
        - article [ref=f7e59]:
