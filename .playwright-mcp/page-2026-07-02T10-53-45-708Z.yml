          - code [ref=f7e68]: CREATE TABLE accounts ( id UUID PRIMARY KEY, workspace_name VARCHAR(100), owner_email VARCHAR(255), plan VARCHAR(20), created_at TIMESTAMP ); CREATE TABLE subscriptions ( id UUID PRIMARY KEY, account_id UUID REFERENCES accounts(id), status VARCHAR(20), current_period_end TIMESTAMP, amount_cents INT ); CREATE TABLE invoices ( id UUID PRIMARY KEY, subscription_id UUID REFERENCES subscriptions(id), amount_cents INT, paid BOOLEAN, issued_at TIMESTAMP );
        - article [ref=f7e69]:
