          - code [ref=f7e48]: CREATE TABLE users ( id UUID PRIMARY KEY, email VARCHAR(255) UNIQUE NOT NULL, full_name VARCHAR(100), avatar_url TEXT, created_at TIMESTAMP ); CREATE TABLE conversations ( id UUID PRIMARY KEY, title VARCHAR(120), created_at TIMESTAMP ); CREATE TABLE messages ( id UUID PRIMARY KEY, conversation_id UUID REFERENCES conversations(id), user_id UUID REFERENCES users(id), content TEXT, created_at TIMESTAMP );
